openapi: 3.0.3
info:
  title: JolOmo SMS gateway (device API)
  version: 0.1.0
  description: |
    Маршруты для Android-устройства SMS-шлюза (SP10-01). Существуют только при jolomo.sms.gateway=android.
    Авторизация токеном устройства, куки и CSRF нет. Ответы с телефонами и текстом SMS не кэшируются.
    Полное описание правил: docs/sms-gateway.md.
paths:
  /api/v1/gateway/poll:
    post:
      summary: Опрос, закрепляет сообщения за устройством (статус сообщений не меняет)
      security: [{ deviceToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Сообщения для отправки (пусто, если ничего нет)
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        commandId: { type: string }
                        phone: { type: string, example: '+996555000001' }
                        body: { type: string }
        '401':
          description: GATEWAY_UNAUTHORIZED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/gateway/events:
    post:
      summary: События устройства по сообщениям (ACCEPTED, SENT, DELIVERED, FAILED)
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [commandId, type]
                    properties:
                      commandId: { type: string, maxLength: 200 }
                      type: { type: string, enum: [ACCEPTED, SENT, DELIVERED, FAILED] }
                      reason: { type: string, description: Короткий код A-Z 0-9 _ для FAILED }
      responses:
        '200':
          description: Результат по каждому событию
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        commandId: { type: string }
                        outcome: { type: string, enum: [APPLIED, IGNORED, REJECTED] }
        '400':
          description: INVALID_GATEWAY_EVENT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: GATEWAY_UNAUTHORIZED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
  schemas:
    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
