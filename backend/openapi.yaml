openapi: 3.0.3
info:
  title: JolOmo API
  version: 0.2.0
  description: |
    Контракт спринта 2 (вход по телефону, сессии). Любая ошибка приходит одним конвертом ApiError.
    Сессия живёт в cookie (HttpOnly; Secure; SameSite=Lax), токенов в теле ответа и в localStorage нет.
    Мутации, отправленные с cookie сессии, требуют заголовок X-CSRF-Token, равный cookie jl_csrf.
servers:
  - url: http://localhost:8080
paths:
  /actuator/health:
    get:
      summary: Health
      responses:
        '200':
          description: Сервис жив
  /api/v1/auth/otp/request:
    post:
      summary: Запросить код входа по SMS
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: Код поставлен в очередь SMS. Сам код в ответе не возвращается.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpIssued' }
        '400': { $ref: '#/components/responses/Error' }
        '429':
          description: OTP_TOO_SOON, OTP_RESEND_LIMIT или OTP_BUSY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/auth/otp/verify:
    post:
      summary: Подтвердить код и начать сессию
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: Сессия создана, cookie jl_access, jl_refresh и jl_csrf выставлены.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerified' }
        '400':
          description: OTP_INVALID или OTP_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: USER_SUSPENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429':
          description: OTP_ATTEMPTS_EXHAUSTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/auth/refresh:
    post:
      summary: Обменять refresh на новую пару (ротация)
      description: |
        Refresh берётся из cookie jl_refresh. Отправляйте запросы refresh по одному:
        повторное использование уже обмененного токена отзывает всё семейство.
      security: [{ csrf: [] }]
      responses:
        '204':
          description: Cookie обновлены
          headers:
            Set-Cookie:
              schema: { type: string }
        '401':
          description: SESSION_INVALID или SESSION_REUSED. Cookie очищены, нужен новый вход.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/auth/logout:
    post:
      summary: Выйти (отзывает семейство, очищает cookie)
      security: [{ csrf: [] }]
      responses:
        '204':
          description: Готово
        '403':
          description: CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/auth/csrf:
    get:
      summary: Получить CSRF-токен, если cookie jl_csrf потерялась
      responses:
        '200':
          description: Токен (и Set-Cookie, если cookie не было)
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken: { type: string }
  /api/v1/me:
    get:
      summary: Текущий пользователь
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Только сам субъект
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  phone: { type: string }
        '401':
          description: UNAUTHENTICATED. Попробуйте refresh, затем вход.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/drivers/me:
    post:
      summary: Завести свой профиль водителя (UNVERIFIED), повтор безопасен
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      summary: Свой профиль водителя
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: DRIVER_PROFILE_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/drivers/me/eligibility:
    get:
      summary: Может ли водитель публиковать поездку (подсказка для экрана; сервер решит заново)
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Решение и причина
          content:
            application/json:
              schema:
                type: object
                properties:
                  canPublishTrip: { type: boolean }
                  reason:
                    type: string
                    enum: [OK, NOT_A_DRIVER, NOT_APPROVED, OBLIGATIONS_NOT_LOADED]
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/verification/cases:
    post:
      summary: Подать документы на проверку водителя
      description: |
        multipart/form-data, поле files (1-3 файла): JPEG, PNG или PDF до 8 МБ. Тип определяется по содержимому,
        заявленный Content-Type должен совпасть. Любая ошибка отклоняет всю заявку, ничего не сохраняется.
        Нужен профиль водителя в статусе UNVERIFIED, REJECTED или EXPIRED. Маршрута, отдающего файлы, нет.
      security: [{ accessCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Заявка принята, профиль стал SUBMITTED
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId: { type: string, format: uuid }
                  status: { type: string, enum: [SUBMITTED] }
                  files: { type: integer }
        '400':
          description: UPLOAD_NO_FILES, UPLOAD_TOO_MANY_FILES, UPLOAD_EMPTY_FILE, UPLOAD_TYPE_NOT_ALLOWED, UPLOAD_TYPE_MISMATCH, UPLOAD_INVALID_IMAGE, UPLOAD_IMAGE_TOO_LARGE, UPLOAD_INVALID_PDF, UPLOAD_ACTIVE_CONTENT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: DRIVER_PROFILE_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: CASE_NOT_ALLOWED (заявка уже на рассмотрении или водитель допущен)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '413':
          description: UPLOAD_TOO_LARGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/verification/cases/current:
    get:
      summary: Последняя заявка (без документов)
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId: { type: string, format: uuid }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
        '404':
          description: CASE_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/admin/auth/login:
    post:
      summary: Вход администратора (пароль и TOTP или код восстановления в одном запросе)
      description: |
        Любая ошибка (неверный пароль, код, неизвестный логин, блокировка, отключённая запись) даёт один и тот же ответ.
        После 5 неудач запись блокируется на 15 минут. Один TOTP-код нельзя использовать дважды.
        Сессия живёт 30 минут без продления, cookie jl_admin (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, code]
              properties:
                login: { type: string }
                password: { type: string }
                code: { type: string, description: 6 цифр TOTP или код восстановления вида XXXX-XXXX-XXXX-XXXX }
      responses:
        '200':
          description: Сессия создана
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { $ref: '#/components/schemas/AdminView' }
                  recoveryCodesLeft: { type: integer }
        '401':
          description: ADMIN_LOGIN_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/admin/auth/logout:
    post:
      summary: Выйти (отзывает сессию)
      security: [{ adminCookie: [], csrf: [] }]
      responses:
        '204': { description: Готово }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/admin/auth/me:
    get:
      summary: Текущий администратор
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: Администратор
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminView' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/admin/auth/password:
    post:
      summary: Сменить свой пароль (остальные сессии отзываются)
      security: [{ adminCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, newPassword]
              properties:
                current: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        '204': { description: Пароль изменён }
        '400': { description: PASSWORD_TOO_WEAK }
        '403': { description: ADMIN_PASSWORD_WRONG }
  /api/v1/admin/accounts:
    post:
      summary: Создать администратора (только OWNER). Секреты показываются один раз.
      security: [{ adminCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, displayName, role, reasonCode]
              properties:
                login: { type: string, pattern: '^[a-z0-9._-]{3,64}$' }
                displayName: { type: string }
                role: { type: string, enum: [REVIEWER, SUPPORT, OWNER] }
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '201':
          description: Данные для первого входа (пароль, ключ TOTP, коды восстановления)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '403': { description: ADMIN_FORBIDDEN }
        '409': { description: ADMIN_EXISTS }
  /api/v1/admin/accounts/{id}/disable:
    post:
      summary: Отключить администратора (сессии отзываются сразу)
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string }
      responses:
        '204': { description: Готово }
        '403': { description: ADMIN_FORBIDDEN }
        '409': { description: CANNOT_TARGET_SELF }
  /api/v1/admin/accounts/{id}/reset:
    post:
      summary: Сбросить пароль, TOTP и коды восстановления (потеря устройства)
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string }
      responses:
        '200':
          description: Новые данные для входа, показываются один раз
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '403': { description: ADMIN_FORBIDDEN }
        '409': { description: CANNOT_TARGET_SELF }
  /api/v1/admin/verification/cases:
    get:
      summary: Очередь проверки (старые первыми, без телефонов и документов)
      security: [{ adminCookie: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [SUBMITTED, IN_REVIEW] } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          description: Открытые заявки
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    caseId: { type: string, format: uuid }
                    driverId: { type: string, format: uuid }
                    status: { type: string }
                    createdAt: { type: string, format: date-time }
                    files: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: ADMIN_FORBIDDEN (нужно право VERIFICATION_REVIEW) }
  /api/v1/admin/verification/cases/{id}:
    get:
      summary: Заявка и список её файлов (только метаданные)
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Заявка }
        '404': { description: CASE_NOT_FOUND }
  /api/v1/admin/verification/cases/{id}/start:
    post:
      summary: Начать проверку (SUBMITTED в IN_REVIEW)
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '204': { description: Готово }
        '409': { description: INVALID_CASE_STATE }
  /api/v1/admin/verification/cases/{id}/decision:
    post:
      summary: Решение по заявке (IN_REVIEW в APPROVED или REJECTED); профиль водителя меняется вместе с заявкой
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reasonCode]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reasonCode: { type: string }
      responses:
        '204': { description: Готово }
        '409': { description: INVALID_CASE_STATE }
  /api/v1/admin/verification/objects/{objectId}/access:
    post:
      summary: Выдать короткую ссылку на документ (действует 5 минут, привязана к этому администратору)
      description: Нужна цель просмотра. Выдача и каждое скачивание пишутся в аудит. После решения по заявке документы недоступны.
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: objectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purposeCode]
              properties:
                purposeCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '201':
          description: Ссылка
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  path: { type: string }
                  expiresAt: { type: string, format: date-time }
        '410': { description: OBJECT_UNAVAILABLE }
  /api/v1/admin/verification/documents/{token}:
    get:
      summary: Скачать документ (вложение; право проверяется заново, каждое скачивание в аудите)
      security: [{ adminCookie: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Байты документа (Content-Disposition attachment, nosniff, no-store)
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '404': { description: ACCESS_NOT_FOUND (неизвестный или чужой токен) }
        '410': { description: ACCESS_EXPIRED или OBJECT_UNAVAILABLE }
  /api/v1/trips:
    get:
      summary: Публичный поиск поездок (вход не нужен)
      description: |
        Только опубликованные, не просроченные, не полные поездки выбранного направления. Окно отправления задаётся
        пересечением; расстояние в метрах от точки каталога. Без владельца, телефонов и документов.
      parameters:
        - { name: direction, in: query, required: true, schema: { type: string, enum: [BISHKEK_TO_KARAKOL, KARAKOL_TO_BISHKEK] } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: По умолчанию сейчас }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: nearPickupLocationId, in: query, schema: { type: string, format: uuid } }
        - { name: radiusMeters, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 5000 } }
        - { name: seats, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        '200':
          description: Страница результатов, по времени отправления, затем по расстоянию
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: INVALID_DIRECTION, INVALID_WINDOW, INVALID_SEATS, INVALID_LIMIT, INVALID_OFFSET, INVALID_RADIUS, PICKUP_NOT_IN_CATALOG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      summary: Создать черновик поездки (только водитель с профилем)
      security: [{ accessCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripCreate' }
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTrip' }
        '400':
          description: "INVALID_DIRECTION, INVALID_REQUEST, INVALID_WINDOW, DEPARTURE_IN_PAST, INVALID_SEATS, INVALID_PRICE, INVALID_PARCEL_SLOTS, PICKUP_NOT_IN_CATALOG, PICKUP_WRONG_CITY"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: NOT_A_DRIVER или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/trips/mine:
    get:
      summary: Мои поездки, новые первыми
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnerTrip' }
  /api/v1/trips/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Владельцу своя поездка в любом статусе, остальным только опубликованная (публичный вид, без владельца)
      responses:
        '200':
          description: OwnerTrip для владельца, PublicTrip для остальных
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/OwnerTrip' }
                  - { $ref: '#/components/schemas/PublicTrip' }
        '404':
          description: TRIP_NOT_FOUND (чужой черновик не отличить от несуществующей)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      summary: Правка полей ИЛИ смена статуса (PUBLISHED, CANCELLED), но не то и другое сразу
      description: |
        Черновик правится целиком. У опубликованной можно менять только priceKgs, seatsTotal и parcelSlotsTotal
        (иначе 409 TRIP_FIELD_LOCKED). Публикация и правка опубликованной требуют допуска водителя и загруженного
        выключателя обязательств (403 NOT_APPROVED, OBLIGATIONS_NOT_LOADED). Отмена доступна всегда и безопасна при повторе.
      security: [{ accessCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripPatch' }
      responses:
        '200':
          description: Поездка после изменения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerTrip' }
        '400':
          description: INVALID_REQUEST, INVALID_STATUS и коды проверки полей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: TRIP_NOT_FOUND (в том числе чужая поездка)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_TRIP_STATE, TRIP_FIELD_LOCKED, CAPACITY_BELOW_TAKEN, DEPARTURE_IN_PAST
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/trips/{tripId}/bookings:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Запросить места в поездке (SP06-01, SP06-03)
      description: |
        Запрос ничего не занимает: места занимает только принятие водителем. Заголовок Idempotency-Key обязателен
        (8-128 символов A-Z a-z 0-9 . _ -). Тот же ключ и то же тело (поездка и число мест) возвращают сохранённый ответ
        с заголовком Idempotent-Replayed: true, в том числе после рестарта. Другое тело с тем же ключом это 409
        IDEMPOTENCY_KEY_REUSED. Отказы не сохраняются. В ответе нет телефонов.
      security: [{ accessCookie: [], csrf: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Бронь в состоянии REQUESTED (или сохранённый ответ при повторе)
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Только при повторе }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: INVALID_SEATS, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: OWN_TRIP, USER_NOT_ACTIVE или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: TRIP_NOT_FOUND (нет такой, не опубликована или отменена)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: NOT_ENOUGH_SEATS, TRIP_DEPARTED, BOOKING_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      summary: Запросы на свою поездку (водителю)
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Брони поездки, старые первыми
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: TRIP_NOT_FOUND (чужая поездка не отличима от несуществующей)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/bookings/mine:
    get:
      summary: Мои запросы и брони, новые первыми
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/bookings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Бронь видят только её пассажир и водитель поездки
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: BOOKING_NOT_FOUND (чужая бронь не отличима от несуществующей)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/bookings/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель принимает запрос (SP06-02)
      description: |
        Под блокировкой поездки проверяет места и списывает их: у последнего места один победитель. Повтор принятия
        безопасен и места второй раз не списывает. Нужен допуск водителя (правило MANAGE_BOOKINGS).
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Бронь в состоянии ACCEPTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: NOT_A_DRIVER, NOT_APPROVED или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: BOOKING_NOT_FOUND (не владелец поездки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: NO_SEATS_LEFT, INVALID_BOOKING_STATE, INVALID_TRIP_STATE, TRIP_DEPARTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/bookings/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель отклоняет запрос (места не меняются, повтор безопасен)
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Бронь в состоянии REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: BOOKING_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_BOOKING_STATE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/bookings/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель фиксирует, что пассажир поехал (COMPLETED)
      description: |
        Только водитель этой поездки, только из ACCEPTED и только после времени отправления (иначе 409 TRIP_NOT_DEPARTED).
        По часам бронь не завершается. Места не возвращаются. Повтор безопасен. Правила: docs/booking-lifecycle-and-metrics.md.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Бронь в состоянии COMPLETED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: BOOKING_NOT_FOUND (не водитель этой поездки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_BOOKING_STATE, TRIP_NOT_DEPARTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/bookings/{id}/no-show:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель фиксирует неявку пассажира (NO_SHOW)
      description: Те же правила и коды, что у complete. NO_SHOW отдельное состояние, не то же, что отмена.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Бронь в состоянии NO_SHOW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: BOOKING_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_BOOKING_STATE, TRIP_NOT_DEPARTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/bookings/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Отмена брони
      description: |
        Пассажир отменяет свой запрос или принятую бронь, водитель только принятую. После отправления отмены нет.
        Места возвращаются один раз, при переходе ACCEPTED -> CANCELLED; повтор безопасен.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Бронь в состоянии CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: BOOKING_NOT_FOUND (не участник брони)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_BOOKING_STATE, TRIP_DEPARTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/bookings/{id}/contact:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Контакт другой стороны по принятой брони (SP07-01)
      description: |
        Единственный маршрут, который отдаёт телефон по броне. Пассажиру приходит телефон водителя, водителю телефон
        пассажира. Пока бронь не ACCEPTED (и после отказа или отмены) контакта нет. Ответ с Cache-Control: no-store.
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Контакт другой стороны
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingContact' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: CONTACT_NOT_AVAILABLE (бронь не ACCEPTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: BOOKING_NOT_FOUND (не участник брони не отличить от несуществующей брони)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels:
    post:
      summary: Создать заявку на посылку (SP07-04)
      description: |
        Запрещено по умолчанию: пока на сервере не загружен набор обязательств для посылок (obligation_config
        PARCEL_CREATE), любое создание отклонено с 403 OBLIGATIONS_NOT_LOADED, и клиент включить его не может.
        Проверяются поездка (опубликована, не своя, не отправилась, есть слот посылки), размер (S, M, L),
        категория (данные в parcel_categories) и телефон получателя (+996 и 9 цифр; получатель не может быть
        отправителем или водителем). Создание слот не закрепляет (это SP08-01). Цена посылки согласуется вне
        платформы и в модели её нет. Заголовок Idempotency-Key обязателен, повтор возвращает сохранённый ответ.
        Телефон получателя в ответах не возвращается.
      security: [{ accessCookie: [], csrf: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, size, category, recipientPhone]
              properties:
                tripId: { type: string, format: uuid }
                size: { type: string, enum: [S, M, L] }
                category: { type: string, example: DOCUMENTS, description: Код из parcel_categories }
                recipientPhone: { type: string, example: '+996700000001' }
      responses:
        '201':
          description: Заявка в состоянии REQUESTED (или сохранённый ответ при повторе)
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] }, description: Только при повторе }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '400':
          description: INVALID_TRIP, INVALID_PARCEL_SIZE, INVALID_PARCEL_CATEGORY, INVALID_RECIPIENT_PHONE, RECIPIENT_IS_SENDER, RECIPIENT_IS_DRIVER, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: OBLIGATIONS_NOT_LOADED, OWN_TRIP, USER_NOT_ACTIVE или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: TRIP_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: NO_PARCEL_CAPACITY, TRIP_DEPARTED, IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/mine:
    get:
      summary: Мои заявки на посылки, новые первыми
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/parcels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Заявку видят только её отправитель и назначенный водитель
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: PARCEL_NOT_FOUND (чужая заявка не отличима от несуществующей)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/trips/{tripId}/parcels:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Заявки на посылки по своей поездке (водителю)
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: TRIP_NOT_FOUND (чужая поездка не отличима от несуществующей)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель принимает заявку и закрепляет слот посылки (SP08-01)
      description: |
        Под блокировкой поездки закрепляет один слот посылки (размер слот не меняет). У последнего слота один победитель,
        остальные получают 409 NO_PARCEL_CAPACITY. Повтор принятия слот второй раз не занимает. Нужны допуск водителя
        (правило MANAGE_PARCELS) и загруженный набор обязательств для посылок.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Заявка в состоянии ACCEPTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: NOT_A_DRIVER, NOT_APPROVED, OBLIGATIONS_NOT_LOADED или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: PARCEL_NOT_FOUND (не участник заявки не отличим от несуществующей заявки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: NO_PARCEL_CAPACITY, INVALID_PARCEL_STATE, INVALID_TRIP_STATE, TRIP_DEPARTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель отклоняет заявку (слоты не меняются, повтор безопасен)
      description: |
        Отклонить можно только заявку в состоянии REQUESTED.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Заявка в состоянии REJECTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: PARCEL_NOT_FOUND (не участник заявки не отличим от несуществующей заявки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_PARCEL_STATE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Отмена заявки на посылку
      description: |
        Отправитель отменяет заявку или принятую посылку, водитель только принятую. Когда посылка уже у водителя
        (PICKUP_CONFIRMED и дальше), отмены нет. Слот возвращается один раз, при переходе ACCEPTED -> CANCELLED;
        повтор безопасен.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Заявка в состоянии CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: PARCEL_NOT_FOUND (не участник заявки не отличим от несуществующей заявки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_PARCEL_STATE, TRIP_DEPARTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/{id}/pickup:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель забрал посылку, PICKUP_CONFIRMED (SP08-02)
      description: |
        Только назначенный проверенный водитель, строго по цепочке ACCEPTED -> PICKUP_CONFIRMED -> IN_TRANSIT ->
        DELIVERY_PENDING, один шаг за раз. Каждый переход пишет строку аудита (кто, когда, из какого состояния в какое) и
        событие домена. Повтор уже сделанного шага безопасен и нового свидетельства не пишет. DELIVERED отсюда
        недостижимо: его даёт только код получателя.
        Нужна опубликованная поездка.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Заявка в состоянии PICKUP_CONFIRMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: NOT_A_DRIVER, NOT_APPROVED или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: PARCEL_NOT_FOUND (не назначенный водитель не отличим от несуществующей заявки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_PARCEL_STATE (шаг пропущен или идёт назад), INVALID_TRIP_STATE (поездка не опубликована)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/{id}/dispatch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Посылка в пути, IN_TRANSIT
      description: |
        Только назначенный проверенный водитель, строго по цепочке ACCEPTED -> PICKUP_CONFIRMED -> IN_TRANSIT ->
        DELIVERY_PENDING, один шаг за раз. Каждый переход пишет строку аудита (кто, когда, из какого состояния в какое) и
        событие домена. Повтор уже сделанного шага безопасен и нового свидетельства не пишет. DELIVERED отсюда
        недостижимо: его даёт только код получателя.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Заявка в состоянии IN_TRANSIT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: NOT_A_DRIVER, NOT_APPROVED или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: PARCEL_NOT_FOUND (не назначенный водитель не отличим от несуществующей заявки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_PARCEL_STATE (шаг пропущен или идёт назад)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/{id}/arrive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Водитель на месте и ждёт получателя, DELIVERY_PENDING
      description: |
        Только назначенный проверенный водитель, строго по цепочке ACCEPTED -> PICKUP_CONFIRMED -> IN_TRANSIT ->
        DELIVERY_PENDING, один шаг за раз. Каждый переход пишет строку аудита (кто, когда, из какого состояния в какое) и
        событие домена. Повтор уже сделанного шага безопасен и нового свидетельства не пишет. DELIVERED отсюда
        недостижимо: его даёт только код получателя.
      security: [{ accessCookie: [], csrf: [] }]
      responses:
        '200':
          description: Заявка в состоянии DELIVERY_PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parcel' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: NOT_A_DRIVER, NOT_APPROVED или CSRF_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: PARCEL_NOT_FOUND (не назначенный водитель не отличим от несуществующей заявки)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: INVALID_PARCEL_STATE (шаг пропущен или идёт назад)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/parcels/{id}/delivery-challenge:
    post:
      summary: Водитель на месте просит отправить получателю код доставки (SMS)
      description: |
        Только назначенный проверенный водитель и только когда посылка в DELIVERY_PENDING. Код и ссылка уходят SMS на номер
        получателя из заявки; в ответе их нет. Новый запрос отменяет прежний код, повторы ограничены (не чаще раза в 60 секунд,
        не более 5 в час). Код живёт 2 часа.
      security: [{ accessCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Код отправлен получателю
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt: { type: string, format: date-time }
                  resendAfterSeconds: { type: integer }
        '404': { description: PARCEL_NOT_FOUND (чужая посылка тоже) }
        '409': { description: INVALID_PARCEL_STATE или VERIFICATION_LOCKED }
        '429': { description: DELIVERY_TOO_SOON или DELIVERY_RESEND_LIMIT }
  /api/v1/deliveries/{challengeId}:
    get:
      summary: Состояние проверки для страницы получателя (без входа)
      description: Доступ даёт сама ссылка из SMS. Чужая, подменная или заменённая ссылка даёт общий DELIVERY_NOT_FOUND.
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [ACTIVE, CONSUMED, LOCKED, EXPIRED] }
                  expiresAt: { type: string, format: date-time }
        '404': { description: DELIVERY_NOT_FOUND }
  /api/v1/deliveries/{challengeId}/verify:
    post:
      summary: Получатель без аккаунта подтверждает доставку кодом из SMS
      description: |
        Без входа и без CSRF (маршрут не использует сессию), поэтому страница получателя может слать запрос и из браузера,
        где человек уже вошёл в JolOmo. Код привязан к посылке, получателю и переходу, потребляется один раз.
        Три ошибки подряд блокируют проверку (423), посылка получает VERIFICATION_LOCKED, спор не открывается.
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: '123456' }
      responses:
        '200':
          description: Доставка подтверждена
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [DELIVERED] }
        '400': { description: 'DELIVERY_CODE_INVALID (или пустой код: ошибка проверки без списания попытки)' }
        '404': { description: DELIVERY_NOT_FOUND }
        '409': { description: DELIVERY_ALREADY_VERIFIED }
        '410': { description: DELIVERY_EXPIRED }
        '423': { description: DELIVERY_LOCKED (три ошибки или повторная попытка после блокировки) }
  /api/v1/admin/parcels/{id}/unlock-verification:
    post:
      summary: Поддержка снимает блокировку проверки доставки (VERIFICATION_LOCKED в DELIVERY_PENDING)
      description: Право INCIDENT_RECORD, код причины и аудит обязательны. Доставленной посылку это не делает; водитель после этого запрашивает новый код.
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '204': { description: Блокировка снята }
        '403': { description: ADMIN_FORBIDDEN }
        '409': { description: INVALID_PARCEL_STATE (посылка не в VERIFICATION_LOCKED) }
  /api/v1/admin/incidents:
    post:
      summary: Поддержка записывает инцидент по посылке
      description: |
        Право INCIDENT_RECORD, код причины обязателен. Инцидент это только запись: статус посылки не меняется, доставленной
        она не становится, спор не открывается. В записи сохраняются состояние посылки и версия условий (набор обязательств
        при создании посылки). Свободного текста нет.
      security: [{ adminCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcelId, kind, reasonCode]
              properties:
                parcelId: { type: string, format: uuid }
                kind: { type: string, enum: [RECIPIENT_UNREACHABLE, CODE_NOT_RECEIVED, PARCEL_DAMAGED, PARCEL_LOST, HANDOVER_DISPUTE, OTHER] }
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '201':
          description: Записанный инцидент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400': { description: REASON_REQUIRED или INVALID_INCIDENT_KIND }
        '403': { description: ADMIN_FORBIDDEN }
        '404': { description: PARCEL_NOT_FOUND }
    get:
      summary: Инциденты по посылке (новые первыми)
      security: [{ adminCookie: [] }]
      parameters:
        - { name: parcelId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
  /api/v1/admin/incidents/{id}:
    get:
      summary: Инцидент
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Инцидент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { description: INCIDENT_NOT_FOUND }
  /api/v1/admin/drivers/{userId}/suspend:
    post:
      summary: Поддержка приостанавливает водителя
      description: Право DRIVER_SUSPEND (поддержка и владелец), код причины и аудит обязательны. Лишает допуска к публикации и ведению посылок; вместимость и доставку не меняет.
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '204': { description: Водитель приостановлен }
        '403': { description: ADMIN_FORBIDDEN }
        '404': { description: DRIVER_PROFILE_NOT_FOUND }
        '409': { description: INVALID_TRANSITION (уже приостановлен) }
  /api/v1/admin/drivers/{userId}/lift-suspension:
    post:
      summary: Поддержка снимает приостановку (возвращает прежнее состояние, допуск заново не выдаётся)
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '204': { description: Приостановка снята }
        '403': { description: ADMIN_FORBIDDEN }
        '409': { description: INVALID_TRANSITION (водитель не приостановлен) }
  /api/v1/admin/suspicious-activity:
    post:
      summary: Поддержка помечает подозрительную активность пользователя (только запись)
      description: Право ACTIVITY_FLAG. Пометка ничего не блокирует; приостановка это отдельное действие. Свободного текста нет.
      security: [{ adminCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, kind, reasonCode]
              properties:
                userId: { type: string, format: uuid }
                kind: { type: string, enum: [MULTIPLE_ACCOUNTS, FAKE_RECIPIENT_PHONE, REPEATED_CODE_FAILURES, DOCUMENT_MISMATCH, OTHER] }
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '201': { description: Пометка записана }
        '400': { description: REASON_REQUIRED или INVALID_SUSPICION_KIND }
        '403': { description: ADMIN_FORBIDDEN }
        '404': { description: USER_NOT_FOUND }
    get:
      summary: Пометки по пользователю (новые первыми)
      security: [{ adminCookie: [] }]
      parameters:
        - { name: userId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200': { description: Список }
  /api/v1/privacy-notice/current:
    get:
      summary: Действующая версия уведомления о данных (публично)
      description: Текст уведомления лежит в каталогах KY/RU/EN; здесь только версия.
      responses:
        '200':
          description: Версия
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  publishedAt: { type: string, format: date-time }
        '404': { description: NOTICE_NOT_FOUND }
  /api/v1/me/privacy-notice:
    get:
      summary: Какую версию уведомления принял я
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Принятая версия
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  acceptedAt: { type: string, format: date-time }
        '401': { description: UNAUTHENTICATED }
        '404': { description: NOTICE_NOT_ACCEPTED }
    post:
      summary: Принять действующую версию уведомления (повтор той же версии безопасен)
      security: [{ accessCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, maxLength: 32 }
      responses:
        '200': { description: Принятая версия }
        '400': { description: NOTICE_VERSION_INVALID или NOTICE_VERSION_UNKNOWN }
        '401': { description: UNAUTHENTICATED }
        '409': { description: NOTICE_NOT_CURRENT (принять можно только действующую версию) }
  /api/v1/push/vapid-key:
    get:
      summary: Открытый ключ VAPID для подписки в браузере (публично)
      description: Если сервер не настроен на Web Push, ответ 503 PUSH_DISABLED, и приложение не показывает предложение включить уведомления.
      responses:
        '200':
          description: Ключ
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: { type: string, description: Несжатая точка P-256 в base64url, пригодна для applicationServerKey }
        '503': { description: PUSH_DISABLED }
  /api/v1/me/push-subscriptions:
    get:
      summary: Мои действующие подписки Web Push (без адресов)
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PushSubscription' }
        '401': { description: UNAUTHENTICATED }
    post:
      summary: Включить Web Push на этом устройстве (opt-in)
      description: >-
        Тело это результат PushSubscription.toJSON() браузера. Ключи keys принимаются и не сохраняются: push уходит без полезной нагрузки.
        Повтор с тем же адресом продлевает срок. Если человек отказал в разрешении, это обычное состояние: приложение просто не вызывает маршрут.
      security: [{ accessCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, maxLength: 2048 }
                expirationTime: { type: integer, format: int64, nullable: true, description: Срок от браузера, мс от начала эпохи }
                keys: { type: object, description: Принимается и игнорируется }
      responses:
        '200':
          description: Подписка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSubscription' }
        '400': { description: PUSH_ENDPOINT_INVALID (не https или не известная push-служба) или PUSH_SUBSCRIPTION_EXPIRED }
        '401': { description: UNAUTHENTICATED }
        '409': { description: PUSH_LIMIT_REACHED (не больше 10 устройств) }
        '503': { description: PUSH_DISABLED }
  /api/v1/me/push-subscriptions/{id}:
    delete:
      summary: Снять подписку по id (повтор безопасен)
      security: [{ accessCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Снята }
        '401': { description: UNAUTHENTICATED }
        '404': { description: PUSH_SUBSCRIPTION_NOT_FOUND (нет такой или она чужая) }
  /api/v1/me/push-subscriptions/revoke:
    post:
      summary: Снять подписку по адресу (браузер знает адрес, а не id)
      description: Неизвестный или чужой адрес молча даёт 204, чтобы по ответу нельзя было узнать, чей он.
      security: [{ accessCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, maxLength: 2048 }
      responses:
        '204': { description: Готово }
        '401': { description: UNAUTHENTICATED }
  /api/v1/admin/legal-holds:
    post:
      summary: Поставить legal hold на пользователя (только владелец)
      description: Право LEGAL_HOLD. Пока hold действует, задания удаления пользователя не трогают. Свободного текста нет, только код причины.
      security: [{ adminCookie: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, reasonCode]
              properties:
                userId: { type: string, format: uuid }
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '201': { description: Hold поставлен }
        '400': { description: REASON_REQUIRED }
        '403': { description: ADMIN_FORBIDDEN }
        '404': { description: USER_NOT_FOUND }
        '409': { description: LEGAL_HOLD_ALREADY_ACTIVE }
    get:
      summary: Holds по пользователю (новые первыми)
      security: [{ adminCookie: [] }]
      parameters:
        - { name: userId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Список }
        '403': { description: ADMIN_FORBIDDEN }
  /api/v1/admin/legal-holds/{id}/release:
    post:
      summary: Снять legal hold (только владелец)
      security: [{ adminCookie: [], csrf: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, pattern: '^[A-Z0-9_]{3,64}$' }
      responses:
        '200': { description: Hold снят }
        '403': { description: ADMIN_FORBIDDEN }
        '404': { description: LEGAL_HOLD_NOT_FOUND }
        '409': { description: LEGAL_HOLD_ALREADY_RELEASED }
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: jl_admin
    accessCookie:
      type: apiKey
      in: cookie
      name: jl_access
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        parcelId: { type: string, format: uuid }
        kind: { type: string }
        reasonCode: { type: string }
        recordedBy: { type: string, format: uuid }
        parcelStatus: { type: string }
        termsVersion: { type: string }
        createdAt: { type: string, format: date-time }
    TripCreate:
      type: object
      required: [direction, pickupLocationId, departureFrom, departureTo, seatsTotal, priceKgs]
      properties:
        direction: { type: string, enum: [BISHKEK_TO_KARAKOL, KARAKOL_TO_BISHKEK] }
        pickupLocationId: { type: string, format: uuid, description: Точка из каталога в городе отправления }
        departureFrom: { type: string, format: date-time }
        departureTo: { type: string, format: date-time }
        seatsTotal: { type: integer, minimum: 1 }
        priceKgs: { type: integer, minimum: 1, description: Цена места в целых сомах }
        parcelSlotsTotal: { type: integer, minimum: 0, default: 0 }
    TripPatch:
      type: object
      description: Любое подмножество полей TripCreate либо только status.
      properties:
        direction: { type: string, enum: [BISHKEK_TO_KARAKOL, KARAKOL_TO_BISHKEK] }
        pickupLocationId: { type: string, format: uuid }
        departureFrom: { type: string, format: date-time }
        departureTo: { type: string, format: date-time }
        seatsTotal: { type: integer }
        priceKgs: { type: integer }
        parcelSlotsTotal: { type: integer }
        status: { type: string, enum: [PUBLISHED, CANCELLED] }
    OwnerTrip:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED] }
        direction: { type: string }
        pickupLocationId: { type: string, format: uuid }
        departureFrom: { type: string, format: date-time }
        departureTo: { type: string, format: date-time }
        seatsTotal: { type: integer }
        seatsAvailable: { type: integer }
        priceKgs: { type: integer }
        currency: { type: string, example: KGS }
        parcelSlotsTotal: { type: integer }
        parcelSlotsAvailable: { type: integer }
    SearchHit:
      allOf:
        - $ref: '#/components/schemas/PublicTrip'
        - type: object
          properties:
            distanceMeters: { type: number, nullable: true, description: Только если задана nearPickupLocationId }
    PublicTrip:
      type: object
      description: Без владельца, телефонов и документов.
      properties:
        id: { type: string, format: uuid }
        direction: { type: string }
        departureFrom: { type: string, format: date-time }
        departureTo: { type: string, format: date-time }
        pickupCode: { type: string }
        pickupNameKy: { type: string }
        pickupNameRu: { type: string }
        pickupNameEn: { type: string }
        pickupLatitude: { type: number }
        pickupLongitude: { type: number }
        seatsAvailable: { type: integer }
        priceKgs: { type: integer }
        currency: { type: string, example: KGS }
    ApiError:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string, example: OTP_INVALID }
        message: { type: string, description: Ключ перевода, example: error.otp.invalid }
        correlationId: { type: string }
    AdminView:
      type: object
      properties:
        id: { type: string, format: uuid }
        login: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [REVIEWER, SUPPORT, OWNER] }
    Enrollment:
      type: object
      properties:
        adminId: { type: string, format: uuid }
        login: { type: string }
        password: { type: string }
        totpSecret: { type: string }
        otpauthUri: { type: string }
        recoveryCodes: { type: array, items: { type: string } }
    DriverProfile:
      type: object
      properties:
        status:
          type: string
          enum: [UNVERIFIED, SUBMITTED, IN_REVIEW, APPROVED, REJECTED, EXPIRED, SUSPENDED]
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone: { type: string, pattern: '^\+996\d{9}$', example: '+996555000000' }
        purpose: { type: string, enum: [LOGIN] }
    OtpIssued:
      type: object
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer }
    OtpVerify:
      type: object
      required: [challengeId, phone, purpose, code]
      properties:
        challengeId: { type: string, format: uuid }
        phone: { type: string, pattern: '^\+996\d{9}$' }
        purpose: { type: string, enum: [LOGIN] }
        code: { type: string, pattern: '^\d{6}$' }
    OtpVerified:
      type: object
      properties:
        verified: { type: boolean }
        userId: { type: string, format: uuid }
    Booking:
      type: object
      description: Бронь без телефонов и документов. Контакты откроет SP07-01 после ACCEPTED.
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        passengerId: { type: string, format: uuid }
        seats: { type: integer, minimum: 1 }
        status: { type: string, enum: [REQUESTED, ACCEPTED, REJECTED, CANCELLED, COMPLETED, NO_SHOW, REVIEW_REQUIRED] }
        priceKgs: { type: integer, description: Цена одного места на момент запроса, в сомах }
        totalKgs: { type: integer, description: seats * priceKgs }
        currency: { type: string, enum: [KGS] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookingContact:
      type: object
      properties:
        bookingId: { type: string, format: uuid }
        role: { type: string, enum: [DRIVER, PASSENGER], description: Чей это телефон }
        phone: { type: string, example: '+996555000000' }
    PushSubscription:
      type: object
      description: Подписка Web Push. Адреса в ответах нет.
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Parcel:
      type: object
      description: Заявка на посылку без телефонов. Цены посылки в модели нет, она согласуется вне платформы.
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        size: { type: string, enum: [S, M, L] }
        category: { type: string }
        status: { type: string, enum: [REQUESTED, ACCEPTED, PICKUP_CONFIRMED, IN_TRANSIT, DELIVERY_PENDING, DELIVERED, REJECTED, CANCELLED, DELIVERY_FAILED, VERIFICATION_LOCKED, DISPUTED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
