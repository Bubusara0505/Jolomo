# Локальная БД для запуска приложения вручную. Тесты поднимают свой контейнер сами.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jolomo
      POSTGRES_USER: jolomo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jolomo_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - jolomo-db:/var/lib/postgresql/data
volumes:
  jolomo-db:
