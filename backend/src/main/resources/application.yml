spring:
  application:
    name: jolomo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jolomo}
    username: ${DB_USER:jolomo}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Схему создаёт только Flyway. Hibernate таблицы не создаёт (JPA здесь не подключён).

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"

jolomo:
  auth:
    otp:
      # Секрет для HMAC-хеша кодов. Обязателен, из окружения: export OTP_PEPPER=$(openssl rand -hex 32)
      pepper: ${OTP_PEPPER:}
      ttl-seconds: 300
      max-attempts: 5
      resend-interval-seconds: 60
      max-per-hour: 5
  sms:
    gateway: fake
    fake:
      # true только локально: печатает текст SMS (с кодом) в лог. Никогда не включать вне dev.
      log-body: ${SMS_FAKE_LOG_BODY:false}
