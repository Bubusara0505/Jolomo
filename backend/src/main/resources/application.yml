spring:
  application:
    name: jolomo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jolomo}
    username: ${DB_USER:jolomo}
    password: ${DB_PASSWORD:}
  # Документы личности не должны попадать во временный каталог открытым текстом: части до 10 МБ держим в памяти.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 32MB
      file-size-threshold: 10MB
  # Статических маршрутов нет вообще: файлы отдаёт только код сервера.
  web:
    resources:
      add-mappings: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Схему создаёт только Flyway. Hibernate таблицы не создаёт (JPA здесь не подключён).

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"

jolomo:
  export:
    # Ночная выгрузка метрик и событий без персональных данных (SP12-01). По умолчанию выключена.
    # Включение: jolomo.export.enabled=true и ключ псевдонимов: export EXPORT_PSEUDONYM_KEY=$(openssl rand -hex 32)
    enabled: ${EXPORT_ENABLED:false}
    dir: ${EXPORT_DIR:${user.home}/.jolomo/export}
    pseudonym-key: ${EXPORT_PSEUDONYM_KEY:}
  push:
    # Web Push (SP11-02). Необязателен и никогда не доказательство. По умолчанию выключен.
    # Ключи: java tools/VapidKeygen.java (из папки backend). Включено без ключей: приложение не стартует.
    enabled: ${PUSH_ENABLED:false}
    vapid:
      public-key: ${PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${PUSH_VAPID_PRIVATE_KEY:}
      subject: ${PUSH_VAPID_SUBJECT:}
    # Домены push-служб через запятую; пусто = fcm.googleapis.com, push.services.mozilla.com, push.apple.com, notify.windows.com
    allowed-hosts: ${PUSH_ALLOWED_HOSTS:}
    subscription-days: 90
    max-failures: 5
  privacy:
    purge:
      # Ночное удаление ПРОСРОЧЕННЫХ СИНТЕТИЧЕСКИХ строк (SP04-03), 03:10 Asia/Bishkek. Реальных людей не трогает:
      # сроки хранения их данных пусты, пока их не задаст юрист. Выключить: PRIVACY_PURGE_ENABLED=false
      enabled: ${PRIVACY_PURGE_ENABLED:true}
  delivery:
    # Секрет кода доставки (не равен OTP_PEPPER): export DELIVERY_OTP_PEPPER=$(openssl rand -hex 32)
    pepper: ${DELIVERY_OTP_PEPPER:}
    ttl-minutes: 120
    resend-seconds: 60
    max-per-hour: 5
    # Страница получателя (задача фронтенда SP10-03); в SMS уходит эта ссылка и id проверки.
    link-base: ${DELIVERY_LINK_BASE:http://localhost:3000/r}
  admin:
    # Ключ шифрования секретов TOTP: export ADMIN_TOTP_KEY=$(openssl rand -base64 32)
    totp-key: ${ADMIN_TOTP_KEY:}
    # Только для создания первого администратора (см. README), потом убрать из окружения.
    bootstrap-login: ${ADMIN_BOOTSTRAP_LOGIN:}
    session-minutes: 30
    max-failures: 5
    lock-minutes: 15
    pbkdf2-iterations: 600000
  identity:
    # Каталог зашифрованных файлов личности, вне репозитория. На хосте пилота он входит в набор копий.
    dir: ${IDENTITY_DIR:${user.home}/.jolomo/identity}
    # export IDENTITY_KEY=$(openssl rand -base64 32). Потеря ключа = потеря файлов, храните его в копии ключей.
    key: ${IDENTITY_KEY:}
  auth:
    otp:
      # Секрет для HMAC-хеша кодов. Обязателен, из окружения: export OTP_PEPPER=$(openssl rand -hex 32)
      pepper: ${OTP_PEPPER:}
      ttl-seconds: 300
      max-attempts: 5
      resend-interval-seconds: 60
      max-per-hour: 5
      max-global-per-minute: 30
    session:
      # Секрет подписи access-токенов, не короче 32 символов: export SESSION_SECRET=$(openssl rand -hex 32)
      secret: ${SESSION_SECRET:}
      access-ttl-seconds: 900
      refresh-ttl-days: 30
      # true всегда, кроме экзотики: Chrome и Firefox принимают Secure-cookie и на http://localhost
      cookie-secure: ${COOKIE_SECURE:true}
  sms:
    # Ключ шифрования текста SMS в outbox (AES-256): export SMS_BODY_KEY=$(openssl rand -base64 32)
    body-key: ${SMS_BODY_KEY:}
    gateway: fake
    fake:
      # true только локально и только с SPRING_PROFILES_ACTIVE=dev: печатает текст SMS (с кодом) в лог.
      log-body: ${SMS_FAKE_LOG_BODY:false}
