spring:
  application:
    name: jolomo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jolomo}
    username: ${DB_USER:jolomo}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Схему создаёт только Flyway. Hibernate таблицы не создаёт (JPA здесь не подключён).

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"

jolomo:
  auth:
    otp:
      # Секрет для HMAC-хеша кодов. Обязателен, из окружения: export OTP_PEPPER=$(openssl rand -hex 32)
      pepper: ${OTP_PEPPER:}
      ttl-seconds: 300
      max-attempts: 5
      resend-interval-seconds: 60
      max-per-hour: 5
      max-global-per-minute: 30
    session:
      # Секрет подписи access-токенов, не короче 32 символов: export SESSION_SECRET=$(openssl rand -hex 32)
      secret: ${SESSION_SECRET:}
      access-ttl-seconds: 900
      refresh-ttl-days: 30
      # true всегда, кроме экзотики: Chrome и Firefox принимают Secure-cookie и на http://localhost
      cookie-secure: ${COOKIE_SECURE:true}
  sms:
    # Ключ шифрования текста SMS в outbox (AES-256): export SMS_BODY_KEY=$(openssl rand -base64 32)
    body-key: ${SMS_BODY_KEY:}
    gateway: fake
    fake:
      # true только локально и только с SPRING_PROFILES_ACTIVE=dev: печатает текст SMS (с кодом) в лог.
      log-body: ${SMS_FAKE_LOG_BODY:false}
